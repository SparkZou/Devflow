# 备用方案：服务器上没有共享 Caddy、用宿主机 nginx 反代时使用
#   cp deploy/nginx.conf /etc/nginx/sites-available/devflow && ln -s ../sites-available/devflow /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d devflow.aicloud.co.nz --redirect     # HTTPS 由 certbot 自动补上（443 + 80 跳转）
server {
    listen 80;
    listen [::]:80;
    server_name devflow.aicloud.co.nz;

    client_max_body_size 50m;          # 面板可以粘贴多张截图

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 让应用知道是 https（Cookie 加 Secure）
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}

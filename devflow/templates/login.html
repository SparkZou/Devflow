<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · DevFlow AI</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1f2328; --mute:#6b7280; --accent:#2563eb; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--ink); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 28px 24px; width:340px; max-width:92vw; }
  h1 { font-size:20px; margin:0 0 4px; }
  .mute { color:var(--mute); font-size:12px; margin-bottom:18px; }
  label { display:block; font-size:12px; color:var(--mute); margin-top:12px; }
  input { width:100%; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; background:#fff; margin-top:4px; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  button { width:100%; margin-top:18px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; padding:9px 12px; font:inherit; cursor:pointer; }
  button:hover { filter:brightness(1.05); }
  .err { color:var(--bad); font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="on">
  <h1>🚀 DevFlow AI</h1>
  <div class="mute">AI Delivery Agent · 请登录</div>
  <input type="hidden" name="next" value="{{ next }}">
  <label>用户名<input type="text" name="username" value="{{ username }}" autofocus autocapitalize="off" spellcheck="false" required></label>
  <label>密码<input type="password" name="password" required></label>
  {% if error %}<div class="err">❌ {{ error }}</div>{% endif %}
  <button type="submit">登录</button>
</form>
</body>
</html>

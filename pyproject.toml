[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-ai"
version = "0.1.0"
description = "AI Delivery Agent: 微信/钉钉需求 -> GitHub Issue -> Claude 编码 -> CI/CD -> AI 验证 -> 自动交付客户"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.2.0",
  "dingtalk-stream>=0.24.3",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.29",
  "pyyaml>=6",
  "pyperclip>=1.9",
  "typer>=0.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "playwright>=1.43",
  "python-multipart>=0.0.9",
  "pillow>=10",
]

[project.scripts]
devflow = "devflow.cli:app"

[tool.setuptools.packages.find]
include = ["devflow*"]

[tool.setuptools.package-data]
devflow = ["templates/*.html"]
